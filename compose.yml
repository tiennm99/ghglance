# ghglance web UI, built from this repo's Dockerfile.
services:
  ghglance:
    build: .
    entrypoint: ["ghglance"]
    command: ["-serve", ":8080", "-data-dir", "/data", "-retention", "24h"]
    restart: unless-stopped
    # On stop the server drains requests for up to 15s, then revokes the
    # sign-in tokens of dropped and running jobs, each revoke call allowed
    # 15s. Docker's default 10s grace would SIGKILL it before revoking.
    stop_grace_period: 50s
    # Tells Coolify's proxy which container port to route to, even when the
    # domain is entered without a ":8080" suffix.
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_GHGLANCE_8080
      # "Sign in with GitHub" (a GitHub OAuth App) is required. The server
      # has no token of its own: every generation runs on the visitor's
      # sign-in token or a token they paste into the form.
      - GHGLANCE_OAUTH_CLIENT_ID=${GHGLANCE_OAUTH_CLIENT_ID:?set the GitHub OAuth App client ID}
      - GHGLANCE_OAUTH_CLIENT_SECRET=${GHGLANCE_OAUTH_CLIENT_SECRET:?set the GitHub OAuth App client secret}
      - GHGLANCE_PUBLIC_URL=${GHGLANCE_PUBLIC_URL:?set the external origin, e.g. https://ghglance.example.com}
    volumes:
      - ghglance-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ghglance-data:
